<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrisaPlan — Widgets Cristal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 55%, #4A93C6 100%);
      min-height: 100vh;
      padding: 28px;
      color: #F8FAFC;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: flex-start;
      justify-content: flex-end;
    }
    .glass-card {
      width: 310px;
      background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(189, 224, 254, 0.28);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.4);
    }
    .w-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 0.94rem;
      color: #BDE0FE;
    }
    .w-row {
      padding: 8px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      margin-bottom: 7px;
      font-size: 0.84rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #8ECAE6;
    }
    .w-empty {
      font-size: 0.8rem;
      color: #CBD5E1;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="widgets-root" style="display:flex;flex-wrap:wrap;gap:18px;"></div>

  <script>
    function renderWidgets() {
      const root = document.getElementById('widgets-root');
      let state = {};
      try {
        state = JSON.parse(localStorage.getItem('brisaplan_clean_state_v2') || '{}');
      } catch {}

      const prefs = state.selectedWidgets || { tasksAgenda: true, mail: true, habits: true };
      const now = new Date();
      const today = new Date(now - now.getTimezoneOffset() * 60000).toISOString().split('T')[0];
      let html = '';

      if (prefs.tasksAgenda) {
        const pending = (state.tasks || []).filter(t => !t.done).slice(0, 4);
        const blocks = (state.agenda || []).filter(a => a.date === today).slice(0, 3);
        html += `<div class="glass-card">
          <div class="w-head"><span>Tareas y Agenda</span><span>${now.toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit'})}</span></div>
          ${blocks.map(b => `<div class="w-row" style="border-left-color:${b.color || '#8ECAE6'}"><span>${b.time} · ${b.title}</span></div>`).join('')}
          ${pending.map(t => `<div class="w-row" style="border-left-color:${t.color || '#FAD7A0'}"><span>${t.title}</span></div>`).join('')}
          ${!blocks.length && !pending.length ? '<p class="w-empty">Sin pendientes ni bloques hoy</p>' : ''}
        </div>`;
      }

      if (prefs.mail) {
        const msgs = (state.messages || []).filter(m => !m.isSpam).slice(0, 4);
        html += `<div class="glass-card">
          <div class="w-head"><span>Correos</span><span>${msgs.length}</span></div>
          ${msgs.map(m => `<div class="w-row"><span>${m.subject}</span></div>`).join('') || '<p class="w-empty">Bandeja limpia</p>'}
        </div>`;
      }

      if (prefs.habits) {
        const habits = (state.habits || []).slice(0, 5);
        html += `<div class="glass-card">
          <div class="w-head"><span>Hábitos</span><span>Hoy</span></div>
          ${habits.map(h => {
            const done = h.lastCompletedDate === today;
            return `<div class="w-row"><span>${done ? '✓' : '○'} ${h.name}</span><span>🔥 ${h.streak || 0}d</span></div>`;
          }).join('') || '<p class="w-empty">Sin hábitos registrados</p>'}
        </div>`;
      }

      root.innerHTML = html || '<div class="glass-card"><p class="w-empty">Activa al menos un widget en Mi Espacio.</p></div>';
    }
    renderWidgets();
    setInterval(renderWidgets, 4000);
  </script>
</body>
</html>
